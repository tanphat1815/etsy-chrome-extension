<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Etsy Sync</title>
  <link rel="stylesheet" href="../assets/styles/poppup.css" type="text/css">
  <link rel="stylesheet" href="../assets/styles/lang-selector.css" type="text/css">
</head>

<body>
  <div class="wrap">
    <div class="header">

      <div class="header__left">
        <div class="toolbar">
          <button id="menuBtn" class="icon-btn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="icon-btn__bars" aria-hidden="true">
              <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M4 7C4 6.44771 4.44772 6 5 6H24C24.5523 6 25 6.44771 25 7C25 7.55229 24.5523 8 24 8H5C4.44772 8 4 7.55229 4 7Z" fill="#ffffff"></path><path d="M4 13.9998C4 13.4475 4.44772 12.9997 5 12.9997L16 13C16.5523 13 17 13.4477 17 14C17 14.5523 16.5523 15 16 15L5 14.9998C4.44772 14.9998 4 14.552 4 13.9998Z" fill="#ffffff"></path><path d="M5 19.9998C4.44772 19.9998 4 20.4475 4 20.9998C4 21.552 4.44772 21.9997 5 21.9997H22C22.5523 21.9997 23 21.552 23 20.9998C23 20.4475 22.5523 19.9998 22 19.9998H5Z" fill="#ffffff"></path></g></svg>
            </span>
          </button>

          <div id="menuDropdown" class="menu hidden" role="menu" aria-label="Actions">

            <div class="menu__sep" role="separator"></div>

            <button id="clearCacheBtn" class="menu__item btn btn-secondary" type="button" role="menuitem">Reset</button>
            <button id="showLogBtn" class="menu__item btn btn-primary" type="button" role="menuitem">Show log</button>
          </div>
        </div>
      </div>

      <div class="header__center">
        <img src="../assets/icons/white_icon.svg" alt="Logo" width="24" height="24">
        <h1 data-i18n="popup.title">Etsy → Teeinblue Sync</h1>
      </div>

      <div class="header__right">
        <div class="languages-selector">
          <div class="languages-selector__control">
            <!-- Custom UI -->
            <button id="langBtn" class="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="lang-btn__flag" aria-hidden="true">🇬🇧</span>
              <span class="lang-btn__code">EN</span>
              <span class="lang-btn__chev" aria-hidden="true">▾</span>
            </button>

            <div id="langMenu" class="lang-menu hidden" role="listbox" aria-label="Select language">
              <button class="lang-option" type="button" data-lang="EN"><span class="lang-option__flag">🇬🇧</span>EN</button>
              <button class="lang-option" type="button" data-lang="FR"><span class="lang-option__flag">🇫🇷</span>FR</button>
              <button class="lang-option" type="button" data-lang="DE"><span class="lang-option__flag">🇩🇪</span>DE</button>
              <button class="lang-option" type="button" data-lang="IT"><span class="lang-option__flag">🇮🇹</span>IT</button>
              <button class="lang-option" type="button" data-lang="ES"><span class="lang-option__flag">🇪🇸</span>ES</button>
              <button class="lang-option" type="button" data-lang="PT"><span class="lang-option__flag">🇵🇹</span>PT</button>
              <button class="lang-option" type="button" data-lang="VI"><span class="lang-option__flag">🇻🇳</span>VI</button>
            </div>

            <!-- Hidden native select (kept for existing setLanguage() logic) -->
            <select id="languageSelect" class="sr-only" aria-label="Select language" data-i18n-attr="aria-label:popup.language_selector.aria_label">
              <option value="EN" selected>EN</option>
              <option value="FR">FR</option>
              <option value="DE">DE</option>
              <option value="IT">IT</option>
              <option value="ES">ES</option>
              <option value="PT">PT</option>
              <option value="VI">VI</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="teeinblueAPIKey" class="card">
        <div class="line">
          <div class="muted nowrap" data-i18n="popup.api_key.label">Teeinblue API Key:</div>
          <input id="apiKeyInput" type="text" placeholder="Enter API Key" data-i18n-attr="placeholder:popup.api_key.placeholder" />
          <button class="btn btn-secondary" id="submit" type="submit" data-i18n="popup.api_key.button_sync">Check</button>
        </div>
        <div id="teeinblueStatus" class="muted status"></div>
      </div>

      <div id="stateNotOnTarget" class="card hidden">
        <p class="muted" style="margin:0 0 8px;" data-i18n="popup.not_on_target.message">
          You’re not on Etsy seller orders page.
        </p>
        <a id="redirectLink" class="link" href="#" data-i18n="popup.not_on_target.redirect">redirect to Etsy Orders</a>
        <p class="footer muted" style="margin-top:8px;">
          <span data-i18n="popup.not_on_target.target_label">Target:</span>
          <span class="mono">www.etsy.com/your/shops/.../orders</span>
        </p>
      </div>

      <div id="stateOnTarget" class="card hidden">
        <div class="muted small" data-i18n-html="popup.on_target.note_html">
          DOM Extracted orders on Etsy
        </div>

        <div class="actions">
          <button class="btn btn-secondary" id="scanBtn" type="button" data-i18n="popup.buttons.scan_compare">Scan & Compare</button>
          <button class="btn btn-primary" id="syncAllBtn" type="button" data-i18n="popup.buttons.sync_all">Sync all</button>
        </div>

        <div id="mainStatus" class="footer muted"></div>
        <div id="ordersList"></div>
      </div>
    </div>

    <p id="currentUrl" class="footer muted"></p>
  </div>

  <script type="module" src="./index.js"></script>
</body>

</html>
