<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Etsy Sync</title>
    <link rel="stylesheet" href="../assets/styles/poppup.css" type="text/css">
  </head>

  <body>
    <div class="wrap">
      <div class="header">
          <img src="../assets/icons/white_icon.svg" alt="Logo" width="24" height="24">
          <h1>Etsy → Teeinblue Sync</h1>
      </div>

      <div class="content">
        <div id="teeinblueAPIKey" class="card">
          <div class="line">
            <div class="muted nowrap">Teeinblue API Key:</div>
            <input id="apiKeyInput" type="text" placeholder="Enter API Key" />
            <button class="btn btn-secondary" id="submit" type="submit">Sync</button>
          </div>
          <div id="teeinblueStatus" class="muted status"></div>
        </div>

        <div id="stateNotOnTarget" class="card hidden">
          <p class="muted" style="margin:0 0 8px;">
            You’re not on Etsy seller orders page.
          </p>
          <a id="redirectLink" class="link" href="#">redirect to Etsy Orders</a>
          <p class="footer muted" style="margin-top:8px;">
            Target: <span class="mono">www.etsy.com/your/shops/.../orders</span>
          </p>
        </div>

        <div id="stateOnTarget" class="card hidden">
          <div class="muted small">
            This build uses <b>mock extracted orders</b> (DOM extraction to be implemented later).
          </div>

          <div class="actions">
            <button class="btn btn-secondary" id="scanBtn" type="button">Scan & Compare</button>
            <button class="btn btn-primary" id="syncAllBtn" type="button">Sync all</button>
          </div>

          <div id="mainStatus" class="footer muted"></div>
          <div id="ordersList"></div>
        </div>
      </div>

      <p id="currentUrl" class="footer muted"></p>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
